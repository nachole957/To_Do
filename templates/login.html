<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename='images/icon.png') }}" type="image/x-icon">
    <title>Login</title>
    <style>
        body {
            background-color: #192537;
            color: #e3f2fd;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background-color: #1e88e5;
            color: white;
            border: none;
        }
        .btn-primary {
            background-color: #42a5f5;
            border-color: #42a5f5;
        }
        .form-control {
            background-color: #0d47a1;
            color: white;
            border: none;
        }
        .form-control::placeholder {
            color: #bbdefb;
        }
        .alert {
            margin-top: 15px;
        }
        .icon-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .icon-container i {
            font-size: 3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <div class="icon-container text-center">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <h3 class="text-center">Iniciar Sesión</h3>
                        {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            <div id="flash-messages">
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>
                                {% endfor %}
                            </div>
                        {% endif %}
                        {% endwith %}
                        <form action="/login" method="POST">
                            <div class="mb-3 input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" name="username" class="form-control" placeholder="Nombre de usuario" 
                                       required pattern="^[a-zA-Z0-9_]{3,20}$" 
                                       title="El nombre de usuario debe tener entre 3 y 20 caracteres alfanuméricos.">
                            </div>
                            <div class="mb-3 input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" name="password" class="form-control" placeholder="Contraseña" 
                                       required minlength="8" 
                                       title="La contraseña debe tener al menos 8 caracteres.">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Ingresar</button>
                            </div>
                        </form>
                        <div class="mt-3 text-center">
                            <a href="/register" class="text-light">Registrarse</a>
                        </div>
                    </div>
                    <hr class="my-4">
                    <div class="text-center">
                        <p>O inicia sesión con:</p>
                        <a href="/google-login" class="btn btn-light d-flex align-items-center justify-content-center" style="color: #000; border-color: #ccc;">
                            <img src="{{ url_for('static', filename='images/google_logo.png') }}" alt="Google Logo" 
                                 style="width: 20px; height: 20px; margin-right: 10px;">
                            Iniciar Sesión con Google
                        </a>
                        <p>para mejor experiencia :D</p>
                    </div>
                    <hr class="my-4">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
